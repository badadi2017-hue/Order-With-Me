<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">

<g transform="translate(60,40)">
<circle cx="90" cy="90" r="78" fill="none" stroke="#378ADD" stroke-width="4"/>
<circle cx="90" cy="90" r="46" fill="none" stroke="#D85A30" stroke-width="4"/>

<!-- Outer orbit dots: rotate together, clockwise -->
<g>
<circle cx="90" cy="12" r="9" fill="#7F77DD"/>
<animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="9s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="168" cy="90" r="5" fill="#D4537E"/>
<animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="9s" repeatCount="indefinite"/>
</g>

<!-- Inner orbit dots: rotate together, counter-clockwise -->
<g>
<circle cx="44" cy="90" r="7.5" fill="#EF9F27"/>
<animateTransform attributeName="transform" type="rotate" from="360 90 90" to="0 90 90" dur="6s" repeatCount="indefinite"/>
</g>
<g>
<circle cx="90" cy="136" r="6" fill="#1D9E75"/>
<animateTransform attributeName="transform" type="rotate" from="360 90 90" to="0 90 90" dur="6s" repeatCount="indefinite"/>
</g>
</g>

<text x="290" y="115" font-size="46" font-weight="500" letter-spacing="1" fill="currentColor" font-family="Arial, sans-serif">Aditya</text>
<text x="290" y="165" font-size="46" font-weight="500" letter-spacing="1" fill="currentColor" font-family="Arial, sans-serif">Solutions</text>
<line x1="290" y1="180" x2="610" y2="180" stroke="currentColor" stroke-opacity="0.25" stroke-width="0.5"/>
<text x="290" y="202" font-size="13" fill="currentColor" fill-opacity="0.6" font-family="Arial, sans-serif">Orbiting around smart solutions</text>
</svg>
